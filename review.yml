  artifactsDeliberatelySkipped:
  - path: openapi/, asyncapi/, graphql/, grpc/, overlays/, errors/, data-model/, skills/, arazzo/, agentic-access/, scopes/, mcp/
    reason: No machine-readable contract exists to harvest, derive or ground against. Fabrication is not permitted.
  - path: packages/
    reason: Zero first-party client libraries on npm or PyPI. Nothing real to record.
  - path: lifecycle/, changelog/, sandbox/, cli/, components/
    reason: No status page, no versioning or deprecation policy, no sandbox, no CLI and no embeddable components are published.
  - path: security/suncorp-group-vulnerability-disclosure.yml, security/suncorp-group-trust-center.yml
    reason: probe-security-programs.py returned vdp=none trust=none; no disclosure policy, bug bounty, trust centre or named certification is published.
  pointersDeliberatelyNotWired:
  - type: WellKnown
    reason: 48 probes across 8 hosts returned zero documents. Wiring the pointer would award the well_known_catalog check for something that does not exist.
  - type: SecurityTxt
    reason: No security.txt anywhere in the estate.
  - type: Authentication
    reason: The artifact documents a human broker portal SSO, not API authentication. Suncorp Group documents no API auth.
  - type: Compliance
    reason: No published certification or compliance programme.
  - type: Security
    reason: No responsible disclosure policy or security contact found.
  - type: SDKs
    reason: No first-party client libraries exist.
  - type: Postman
    reason: Postman search returns zero results.
  - type: StatusPage
    reason: status.suncorp.com.au and status.suncorpgroup.com.au are NXDOMAIN.
actions:
  openapiPath: null
  openapiProvenance: none — no OpenAPI or Swagger definition is published by Suncorp Group or any of its brands
  apisYmlUpdated: true
  reason: |
    Recorded as an honest stub. apis[] is intentionally EMPTY because Suncorp
    Group publishes no real, documented public API. The openapi/ directory was
    omitted entirely because nothing real was found to save. The measurable
    finding for the insurance sector data set is the absence itself: a
    top-tier Australian P&C carrier with twelve consumer and commercial
    brands, whose only machine-readable integration path is a broker
    management system connection over Steadfast SCTP and Sunrise Exchange,
    behind a representative-granted login.
