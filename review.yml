enrichmentRounds:
- date: '2026-07-25'
  round: 2
  outcome: >-
    Re-ran contract discovery against hosts the first round had not covered —
    the New Zealand properties and the remaining Australian brands — and probed
    the /.well-known/, package-registry, Postman and status-page surfaces. Every
    probe missed. The "no public API" finding is confirmed and widened, and the
    negative evidence is now captured as artifacts rather than prose.
  newProbes:
  - url: https://www.vero.co.nz/
    httpStatus: 200
    note: New Zealand Vero brand site (Incapsula). /developers, /api, /openapi.json, /swagger.json, /api-docs and /llms.txt all return 404.
  - url: https://www.vero.co.nz/sitemap.xml
    httpStatus: 200
    note: 528 URLs. Zero developer, api, swagger or integration paths.
  - url: https://www.vero.co.nz/graphql
    httpStatus: 301
    note: POST introspection redirects to the marketing site. No GraphQL surface.
  - url: https://www.aainsurance.co.nz/
    httpStatus: 202
    note: CloudFront-fronted. Answers EVERY path with HTTP 202 and an empty body (bot challenge), so status codes from this host are not evidence. /graphql returns a 404 HTML page.
  - url: https://developer.vero.co.nz/
    httpStatus: 0
    note: DNS NXDOMAIN. Same for api.vero.co.nz, developer.aainsurance.co.nz, api.aainsurance.co.nz.
  - url: https://api.aami.com.au/
    httpStatus: 0
    note: DNS NXDOMAIN. Same for api.gio.com.au, api.vero.com.au, developer.suncorp.com.au.
  - url: https://www.apia.com.au/
    httpStatus: 200
    note: Apia brand site resolves (Incapsula). No developer surface.
  - url: https://www.shannons.com.au/
    httpStatus: 200
    note: Shannons brand site resolves (Imperva). No developer surface.
  - url: https://www.terrischeer.com.au/
    httpStatus: 200
    note: Terri Scheer brand site resolves (Imperva). No developer surface.
  - url: https://www.bingle.com.au/
    httpStatus: 200
    note: Bingle brand site resolves (Imperva). No developer surface; the developer./api. CNAMEs remain dangling.
  - url: https://status.suncorp.com.au/
    httpStatus: 0
    note: DNS NXDOMAIN. No status page. Same for status.suncorpgroup.com.au.
  - url: https://registry.npmjs.org/-/v1/search?text=suncorp
    httpStatus: 200
    note: Zero packages. No first-party JavaScript SDK exists.
  - url: https://pypi.org/pypi/suncorp/json
    httpStatus: 404
    note: No PyPI package. No first-party Python SDK exists.
  - url: https://www.postman.com/_api/ws/proxy (search-all "suncorp")
    httpStatus: 200
    note: Zero results across workspace, collection, api, apiDefinition, specification, request, environment, mock and flow. No public Postman presence.
  - url: https://hackerone.com/suncorp
    httpStatus: 404
    note: No HackerOne program. bugcrowd.com/suncorp also 404. No bug bounty found.
  - url: https://www.suncorp.com.au/security
    httpStatus: 200
    note: Real page, but it is a Suncorp Bank consumer "Understanding Online Safety" article — not a vulnerability disclosure policy and not a Suncorp Group insurance property. No responsible-disclosure or security@ contact published.
  - url: https://www.suncorpgroup.com.au/.well-known/security.txt
    httpStatus: 200
    note: NOT a document. 212-byte Incapsula noindex HTML shell; this host returns the same body for all six well-known paths probed. See well-known/suncorp-group-well-known.yml.
